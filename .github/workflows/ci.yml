name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Test FastAPI app loading
      env:
        X_API_KEY: "secret-internal-key-123"
        GROQ_API_KEY: "gsk_INVALID_KEY_FOR_TESTING"
        HF_TOKEN: "hf_test"
        REDIS_HOST: "localhost"
        REDIS_PORT: 6379
      run: |
        python -c "import main; print('App loaded successfully')"